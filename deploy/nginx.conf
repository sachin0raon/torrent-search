# nginx front door for the Torrent Search Aggregator container.
# Runs non-root (listens on 8080, all temp/pid paths under /tmp) and routes by
# path to the three co-located processes. See docs/STREAMING.md §4.1.

worker_processes auto;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    server_tokens off;

    # Keep all writable scratch under /tmp so nginx can run as a non-root user.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen      8080;
        server_name _;
        root        /app/static;
        index       index.html;

        # SPA static assets with client-side routing fallback.
        location / {
            try_files $uri /index.html;
        }

        # Python/FastAPI backend.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Go streamer admin API (add magnet, list files).
        location /stream-api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Go streamer byte stream. Buffering is disabled so range responses
        # (206) flow straight through to the player without nginx spooling the
        # whole file to disk.
        location /stream/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Download-manager feature (docs/STREAMING.md §6) — absent unless
        # DOWNLOAD_ENGINE=qbittorrent. Its JSON API and byte-serving path
        # both live under /download-api/, unlike /stream-api/ vs /stream/
        # above, so one location with the streaming-friendly settings covers
        # both; the small JSON responses have no real downside from buffering
        # being off.
        location /download-api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
