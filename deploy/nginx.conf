# nginx front door for the Torrent Search Aggregator container.
# Runs non-root (listens on 8080, all temp/pid paths under /tmp) and routes by
# path to the three co-located processes. See docs/STREAMING.md §4.1.

worker_processes auto;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    server_tokens off;

    # Keep all writable scratch under /tmp so nginx can run as a non-root user.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen      8080;
        server_name _;
        root        /app/static;
        index       index.html;

        # SPA static assets with client-side routing fallback.
        location / {
            try_files $uri /index.html;
        }

        # Internal auth subrequests. FastAPI answers 204 and X-User-Id for a
        # valid session/token, or 401 to deny the request.
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }
        location = /_auth_stream {
            internal;
            proxy_pass http://127.0.0.1:8000/api/auth/verify-stream;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Python/FastAPI backend.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Go streamer admin API (add magnet, list files). Cookie-authenticated;
        # nginx injects the account-scoped client ID. The "acct-" prefix keeps
        # the value non-empty so a missing auth header can never be read by the
        # streamer as unscoped access.
        location /stream-api/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_user_id;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Client-Id       "acct-$auth_user";
            proxy_read_timeout 120s;
        }

        # Go streamer byte stream. External players cannot send cookies, so
        # this path verifies the signed ?token= instead. Buffering is disabled
        # so range responses (206) flow straight through to the player without
        # nginx spooling the whole file to disk.
        location /stream/ {
            auth_request /_auth_stream;
            auth_request_set $auth_user $upstream_http_x_user_id;
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Id "acct-$auth_user";
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Download-manager byte-serving path. Like /stream/, external players
        # use a signed token rather than the session cookie.
        location /download-api/stream/ {
            auth_request /_auth_stream;
            auth_request_set $auth_user $upstream_http_x_user_id;
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Client-Id       "acct-$auth_user";
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Public capability probe for the download manager. Returns only whether
        # DOWNLOAD_ENGINE is configured, so logged-out users still see the
        # Download action and receive the login prompt.
        location = /download-api/status {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Download-manager JSON API (docs/STREAMING.md §6) — cookie-authenticated.
        # Absent unless DOWNLOAD_ENGINE=qbittorrent.
        location /download-api/ {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_user_id;
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Client-Id       "acct-$auth_user";
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
